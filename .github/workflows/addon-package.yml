name: Archyar Blender add-on package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  addon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure-Python checks
        run: python -m unittest discover -s tests -v
      - name: Build installable ZIP
        run: python scripts/build_zip.py
      - name: Upload add-on installer
        uses: actions/upload-artifact@v4
        with:
          name: archyar-blender-install
          path: dist/archyar-blender-v0.2.1.zip
          if-no-files-found: error
